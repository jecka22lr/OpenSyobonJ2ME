name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install pillow
      - name: Fetch dependencies
        run: ./tools/fetch-deps.sh
      - name: Build lite
        run: |
          LITE=1 ./build.sh
          mkdir -p dist && cp build/OpenSyobonJ2ME-lite.jar build/OpenSyobonJ2ME-lite.jad dist/
      - name: Build small screens
        run: |
          SCALE=3 ./build.sh
          SCALE=4 ./build.sh
          cp build/OpenSyobonJ2ME-208.ja? build/OpenSyobonJ2ME-128.ja? dist/
      - name: Build MIDP 1.0
        run: |
          MIDP=1 SCALE=4 ./build.sh
          MIDP=1 SCALE=3 ./build.sh
          cp build/OpenSyobonJ2ME-midp1-*.ja? dist/
      - name: Build full
        run: |
          ./build.sh
          cp build/OpenSyobonJ2ME.jar build/OpenSyobonJ2ME.jad dist/
      - name: Smoke test
        run: for j in dist/*.jar; do ./tools/smoke.sh $j; done
      - uses: actions/upload-artifact@v4
        with:
          name: OpenSyobonJ2ME
          path: |
            dist/
            build/smoke/*.png
      # A push to main whose build.sh VERSION has no release yet publishes one
      # (pushing a v* tag still works too).
      - name: New version?
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(grep '^VERSION=' build.sh | cut -d= -f2)
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" > /dev/null 2>&1; then echo "new=false" >> "$GITHUB_OUTPUT"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && steps.ver.outputs.new == 'true')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: OpenSyobonJ2ME ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.ver.outputs.tag }}
          body_path: .github/release-notes.md
          files: dist/*
